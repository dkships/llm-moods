name: Sync Ship Sense

# Polls github.com/dkships/ship-sense once a day and pushes the regenerated
# /benchmark snapshot to main, so a model scored upstream reaches the repo
# without a hand edit. Lovable syncs main into the editor on push, but it
# does NOT publish: llmvibes.ai only changes when someone runs the Lovable
# publish (deploy_project via the Lovable MCP). Every push therefore opens or
# updates a `publish-needed` issue; close it once the site is republished.
#
# Data-only movement (new model, rescore, price change) pushes automatically.
# A new run_id or version does NOT: that means ship-sense re-scored the bank,
# and the page's hand-written copy — the dimension table, the method and
# limitations paragraphs — is sourced from the README and deserves a read.
# That case opens an issue instead; re-run with force to push it anyway.

on:
  schedule:
    # 13:17 UTC daily. Off the hour because GitHub queues cron jobs that land
    # on :00 and the delay can stretch to tens of minutes.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Push even if the run id or version changed"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-ship-sense
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Sync snapshot from ship-sense
        run: npm run sync:shipsense -- --summary "$RUNNER_TEMP/summary.json"

      - name: Classify the change
        id: change
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/summary.json"
          if [ -z "$(git status --porcelain)" ]; then
            echo "board unchanged — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "run_changed=$(jq -r '.runChanged' "$summary")" >> "$GITHUB_OUTPUT"
          echo "message=$(jq -r '.summary' "$summary")" >> "$GITHUB_OUTPUT"
          echo "run=$(jq -r '"\(.runId) \(.version), \(.modelCount) models"' "$summary")" >> "$GITHUB_OUTPUT"
          git --no-pager diff --stat

      # Everything the push would land is verified first: lint, the snapshot
      # invariants in src/test/ship-sense.test.ts, and the build (whose
      # prerender step fails loudly on OG/JSON-LD drift). A bad sync never
      # reaches main.
      - name: Verify
        if: steps.change.outputs.changed == 'true'
        run: |
          npm run lint
          npm test
          npm run build

      - name: Push snapshot
        id: push
        if: >-
          steps.change.outputs.changed == 'true' &&
          (steps.change.outputs.run_changed == 'false' || inputs.force)
        env:
          MESSAGE: ${{ steps.change.outputs.message }}
          RUN: ${{ steps.change.outputs.run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/ship-sense-snapshot.ts src/data/ship-sense-teaser.ts public/benchmark/og.png
          git commit -m "Sync Ship Sense: ${MESSAGE}" -m "Run ${RUN}. Regenerated by .github/workflows/sync-ship-sense.yml."
          # Lovable pushes to main between runs; rebase rather than fail.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1

      # A push lands in the repo and the Lovable editor, not on llmvibes.ai.
      # Publishing needs an OAuth session with the Lovable MCP, which CI cannot
      # hold, so leave a loud, single, reopening issue instead of a silent push.
      - name: Open or update the publish-needed issue
        if: steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.change.outputs.message }}
          RUN: ${{ steps.change.outputs.run }}
          SHA: ${{ steps.push.outputs.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="$(cat <<EOF
          The daily sync pushed a new Ship Sense snapshot to main as \`${SHA}\` (${MESSAGE}; run ${RUN}; [workflow run](${URL})). Lovable has synced it but llmvibes.ai/benchmark is still serving the previous build.

          Publish it from a Claude Code session in this repo: confirm the Lovable sync shows \`${SHA}\`, run \`deploy_project\` with only the project id, then verify the live \`/assets/index-*.js\` hash matches a local \`npm run build\` (sequence in CLAUDE.md, Lovable Workflow). Close this issue once verified; the next push reopens it.
          EOF
          )"
          gh label create publish-needed --color 0E8A16 --description "Main is ahead of llmvibes.ai; run the Lovable publish" --force >/dev/null 2>&1 || true
          EXISTING=$(gh issue list --label publish-needed --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Publish llmvibes.ai: Ship Sense snapshot pushed" --label publish-needed --body "$BODY"
          fi

      - name: Open a review issue for a new run
        if: >-
          steps.change.outputs.changed == 'true' &&
          steps.change.outputs.run_changed == 'true' && !inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.change.outputs.message }}
          RUN: ${{ steps.change.outputs.run }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Ship Sense: new run ${RUN} needs a review"
          if gh issue list --state open --search "$title in:title" --json title \
             | jq -e --arg t "$title" 'any(.title == $t)' > /dev/null; then
            echo "issue already open"
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          The daily sync found a new Ship Sense run, so it did not push.

          - Change: ${MESSAGE}
          - Run: ${RUN}
          - Workflow run: ${URL}

          A new run means the bank was re-scored. Check the ship-sense README against the copy this repo keeps by hand — \`SHIP_SENSE_DIMENSIONS\` and the method/limitations paragraphs in \`src/pages/Benchmark.tsx\` — then either update them and run \`npm run sync:shipsense\` locally, or re-run the workflow with **force** to push the data as-is.
          EOF
          )"
